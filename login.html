<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instafuture - Unified Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: Arial, sans-serif; }
        .container { margin-top: 50px; max-width: 500px; background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        .form-section, .home-section { display: none; }
        .active { display: block !important; }
        .btn-primary { background-color: #4CAF50; border: none; }
        .btn-primary:hover { background-color: #45a049; }
        h2, h4 { text-align: center; }
        .form-label { font-weight: bold; }
    </style>
</head>
<body>
<div id="authContainer" class="container">
    <h2 class="mb-4">Instafuture</h2>

    <!-- Signup Section -->
    <div id="signupSection" class="form-section active">
        <h4>Create Account</h4>
        <form id="signupForm">
            <div class="mb-3">
                <label for="signupEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="signupEmail" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="#" onclick="showSection('loginSection')">Login</a></p>
    </div>

    <!-- OTP Verification -->
    <div id="otpSection" class="form-section">
        <h4>Verify OTP</h4>
        <form id="otpForm">
            <div class="mb-3">
                <label for="otpCode" class="form-label">Enter OTP</label>
                <input type="text" class="form-control" id="otpCode" required>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">Create Password</label>
                <input type="password" class="form-control" id="newPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
        </form>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="form-section">
        <h4>Login</h4>
        <form id="loginForm">
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">Forgot password? <a href="#" onclick="showSection('resetSection')">Reset Password</a></p>
    </div>

    <!-- Password Reset -->
    <div id="resetSection" class="form-section">
        <h4>Reset Password</h4>
        <form id="resetForm">
            <div class="mb-3">
                <label for="resetEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="resetEmail" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send OTP</button>
        </form>
    </div>

</div>

<script>
    let currentEmail = '';

    function showSection(sectionId) {
        document.querySelectorAll('.form-section, .home-section').forEach(section => section.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
    }

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        currentEmail = document.getElementById('signupEmail').value;
        await fetch('http://127.0.0.1:8000/login/signup', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail })
        });
        alert('OTP sent!');
        showSection('otpSection');
    });

    // Verify OTP
    document.getElementById('otpForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const otp = document.getElementById('otpCode').value;
        const password = document.getElementById('newPassword').value;
        await fetch('http://127.0.0.1:8000/login/verify-otp', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail, otp, password })
        });
        alert('Account created!');
        showSection('loginSection');
    });

    // Login
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const response = await fetch('http://127.0.0.1:8000/login/login', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (response.ok) {
            // Redirect to instafuture.html after successful login
            window.location.href = "instafuture.html";
        } else {
            alert('Login failed.');
        }
    });

    // Password Reset
    document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value;
        await fetch('http://127.0.0.1:8000/login/request-password-reset', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        alert('OTP sent for password reset!');
    });
</script>
</body>
</html>
